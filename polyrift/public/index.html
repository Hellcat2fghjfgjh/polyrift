<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Polyrift</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="menu" class="overlay">
  <div class="panel">
    <div class="mainCol">
      <h1>POLY<span>RIFT</span></h1>
      <p class="tag">Shoot shapes. Level up. Pick a class. Hold the arena.</p>
      <input id="name" maxlength="18" placeholder="Enter a name" autocomplete="off" spellcheck="false">
      <div id="modes">
        <button data-mode="1" class="on">FFA / Maze</button>
        <button data-mode="2">2 / 4 Teams</button>
        <button data-mode="3">Domination</button>
        <button data-mode="4">Boss Rush</button>
        <button data-mode="5">Tag</button>
        <button data-mode="6">Sandbox</button>
      </div>
      <p id="modeInfo" class="info"></p>
      <div id="devbox">
        <label for="code">Developer code <span>(server owner only)</span></label>
        <div class="row">
          <input id="code" type="password" maxlength="64" placeholder="Developer code" autocomplete="off">
          <button id="unlock" type="button">Unlock</button>
        </div>
        <p id="devStatus"></p>
      </div>
      <button id="play">Play</button>
      <p id="status" class="status"></p>
    </div>
    <div class="sideCol">
      <div class="help" id="help">
        <b>WASD</b> move · <b>Mouse</b> aim · <b>Click / Space</b> shoot
      </div>
      <button id="keysBtn" class="ghost" type="button">Controls</button>
      <div id="keysPanel" hidden>
        <div id="keysGrid"></div>
        <p class="keysNote">Click a key, then press the new one (Esc cancels). Moving, shooting and the number keys are fixed.</p>
        <button id="keysReset" class="ghost" type="button">Reset to defaults</button>
      </div>
    </div>
  </div>
</div>

<div id="death" class="overlay" hidden>
  <div class="panel small">
    <h2 id="deathTitle">You were destroyed</h2>
    <p id="deathBy" class="tag"></p>
    <p id="deathNote" class="note"></p>
    <div id="deathStats" class="stats"></div>
    <button id="respawn">Respawn <small>(Enter)</small></button>
    <button id="toMenu" class="ghost">Change mode</button>
  </div>
</div>

<form id="chatBox" hidden autocomplete="off">
  <input id="chatInput" maxlength="80" placeholder="Say something: Enter sends, Esc cancels" autocomplete="off" spellcheck="false" enterkeyhint="send">
</form>

<script src="game.js"></script>
</body>
</html>
